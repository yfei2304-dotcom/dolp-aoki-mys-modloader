name: Build Aoki+Mysterious ModLoader site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolp-site-build
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact v0.768 ModLoader core
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://dolp-aoki-modloader.yfei2304.chatgpt.site/'
          EXPECTED_SIZE='67147773'
          EXPECTED_SHA='ebda02401b169579b30bfd3796e685e60bee23d46ee06f61548c5e7f0f2108ef'
          mkdir -p /tmp/dolp-build /tmp/dolp-site/payload

          curl -fL --retry 2 --max-time 180             -A 'Mozilla/5.0 (GitHub Actions DoLP builder)'             "${ROOT}payload/game-v0768.bundle"             -o /tmp/dolp-build/source.bundle

          gzip -dc /tmp/dolp-build/source.bundle > /tmp/dolp-build/source.html
          actual_size=$(wc -c < /tmp/dolp-build/source.html)
          actual_sha=$(sha256sum /tmp/dolp-build/source.html | awk '{print $1}')

          echo "uncompressed_bytes=$actual_size"
          echo "source_sha256=$actual_sha"
          test "$actual_size" = "$EXPECTED_SIZE"
          test "$actual_sha" = "$EXPECTED_SHA"
          grep -aq '0.5.11.9 DoLP v0.768' /tmp/dolp-build/source.html
          grep -aq 'window.modDataValueZipList' /tmp/dolp-build/source.html

          cp /tmp/dolp-build/source.bundle /tmp/dolp-site/payload/game-v0768.bundle

      - name: Download MYS image map
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 120             -A 'Mozilla/5.0 (GitHub Actions DoLP builder)'             'https://dolp.dolmods.net/aokimyst/img.json'             -o /tmp/dolp-build/img.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/dolp-build/img.json').read_text('utf-8'))
          required=[
              'misc/sky/stars/star-2.png',
              'misc/sky/stars/star-3.png',
              'misc/sky/stars/star-4.png',
              'misc/locations/banner/ice.png',
              'misc/locations/banner/water.png',
              'misc/locations/banner/reflective.png',
              'misc/locations/banner/snow.png',
              'ui/card-logo.png',
              'body/base-classic.png',
              'body/base-head.png',
          ]
          print('mapping_count=', len(d))
          if len(d) < 30000:
              raise SystemExit(f'Unexpectedly small MYS image map: {len(d)}')
          missing=[k for k in required if not d.get(k)]
          for k in required:
              print(k, '=>', d.get(k))
          if missing:
              raise SystemExit('Required screenshot assets missing from MYS map: ' + ', '.join(missing))
          PY

      - name: Materialize all Aoki+Mysterious images into site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed

          raw_mapping=json.loads(Path('/tmp/dolp-build/img.json').read_text('utf-8'))
          allowed_ext={'.png','.gif','.jpg','.jpeg','.webp','.svg','.avif'}
          mapping={k:v for k,v in raw_mapping.items() if Path(k).suffix.lower() in allowed_ext}
          skipped=[k for k in raw_mapping if k not in mapping]
          print(f'image_mappings={len(mapping)}, skipped_non_images={len(skipped)}')
          for k in skipped[:20]: print('skip_non_image:', k)
          root=Path('/tmp/dolp-site/img')
          root.mkdir(parents=True, exist_ok=True)

          def safe_dest(key):
              key=key.replace('\\', '/').lstrip('/')
              parts=[p for p in key.split('/') if p not in ('', '.')]
              if '..' in parts:
                  raise ValueError(f'unsafe path: {key}')
              return root.joinpath(*parts)

          def download(item):
              key, mapped=item
              dest=safe_dest(key)
              dest.parent.mkdir(parents=True, exist_ok=True)
              url='https://img.dolmods.net/' + mapped
              last=None
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (GitHub Actions DoLP builder)'})
                      with urllib.request.urlopen(req, timeout=45) as r:
                          data=r.read()
                      if not data:
                          raise RuntimeError('empty response')
                      dest.write_bytes(data)
                      return key, len(data), None
                  except Exception as e:
                      last=e
                      time.sleep(0.4 * (attempt + 1))
              return key, 0, repr(last)

          total=len(mapping.items())
          failures=[]
          bytes_total=0
          done=0
          with ThreadPoolExecutor(max_workers=24) as pool:
              futures=[pool.submit(download, item) for item in mapping.items()]
              for fut in as_completed(futures):
                  key, size, err=fut.result()
                  done += 1
                  bytes_total += size
                  if err:
                      failures.append((key, err))
                  if done % 1000 == 0 or done == total:
                      print(f'images {done}/{total}, bytes={bytes_total}, failures={len(failures)}', flush=True)

          if failures:
              print('first failures:')
              for key, err in failures[:30]:
                  print(key, err)
              raise SystemExit(f'Image materialization failed for {len(failures)} files')

          print('image_count=', total)
          print('image_bytes=', bytes_total)
          PY

          test -s /tmp/dolp-site/img/misc/sky/stars/star-2.png
          test -s /tmp/dolp-site/img/misc/sky/stars/star-3.png
          test -s /tmp/dolp-site/img/misc/sky/stars/star-4.png
          test -s /tmp/dolp-site/img/misc/locations/banner/ice.png
          test -s /tmp/dolp-site/img/misc/locations/banner/water.png
          test -s /tmp/dolp-site/img/misc/locations/banner/reflective.png
          test -s /tmp/dolp-site/img/misc/locations/banner/snow.png
          test -s /tmp/dolp-site/img/ui/card-logo.png
          echo "materialized_files=$(find /tmp/dolp-site/img -type f | wc -l)"
          echo "materialized_bytes=$(du -sb /tmp/dolp-site/img | awk '{print $1}')"

      - name: Restore MYS ZIP-only assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '/tmp/dolp-site/img/hair/fringe/swept left'
          cat > /tmp/swept-left-chest.b64 <<'B64'
          ...
          B64
          base64 -d /tmp/swept-left-chest.b64 > '/tmp/dolp-site/img/hair/fringe/swept left/chest.png'
          test -s '/tmp/dolp-site/img/hair/fringe/swept left/chest.png'
          sha256sum '/tmp/dolp-site/img/hair/fringe/swept left/chest.png'

      - name: Fetch local gzip fallback library
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 60             'https://dolp-aoki-modloader.yfei2304.chatgpt.site/pako_inflate.min.js'             -o /tmp/dolp-site/pako_inflate.min.js
          test $(wc -c < /tmp/dolp-site/pako_inflate.min.js) -gt 1000

      - name: Build Service Worker and launcher
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="mys-static-${GITHUB_SHA:0:12}"
          COMPRESSED=$(wc -c < /tmp/dolp-site/payload/game-v0768.bundle)
          UNCOMPRESSED=$(wc -c < /tmp/dolp-build/source.html)
          IMAGE_COUNT=$(find /tmp/dolp-site/img -type f | wc -l)
          IMAGE_BYTES=$(du -sb /tmp/dolp-site/img | awk '{print $1}')

          cat > /tmp/dolp-site/sw.js <<EOF
          "use strict";
          importScripts("./pako_inflate.min.js");

          const BUILD_ID = "${BUILD_ID}";
          const GAME_BUNDLE = "payload/game-v0768.bundle";

          self.addEventListener("install", event => event.waitUntil(self.skipWaiting()));
          self.addEventListener("activate", event => event.waitUntil(self.clients.claim()));
          self.addEventListener("message", event => {
            if (event.data === "skipWaiting") self.skipWaiting();
            if (event.data === "getBuildId" && event.ports[0]) event.ports[0].postMessage(BUILD_ID);
          });

          function isGame(pathname) {
            return pathname.endsWith("/game-v0768.html");
          }

          async function serveGame() {
            const bundleUrl = new URL(GAME_BUNDLE, self.registration.scope);
            const response = await fetch(bundleUrl, { cache: "no-store" });
            if (!response.ok) throw new Error("Game bundle request failed: " + response.status);

            let body;
            if (typeof DecompressionStream === "function" && response.body) {
              body = response.body.pipeThrough(new DecompressionStream("gzip"));
            } else {
              const compressed = new Uint8Array(await response.arrayBuffer());
              const inflater = self.pako || pako;
              body = inflater.ungzip(compressed);
            }

            return new Response(body, {
              status: 200,
              headers: {
                "Content-Type": "text/html; charset=utf-8",
                "Cache-Control": "no-store",
                "X-DoLP-Web-Build": BUILD_ID,
                "X-DoLP-Art-Pack": "aokiutage_mys",
                "X-DoLP-Images": "same-origin-static",
              },
            });
          }

          self.addEventListener("fetch", event => {
            if (event.request.method !== "GET") return;
            const url = new URL(event.request.url);
            if (url.origin !== self.location.origin) return;
            if (!isGame(url.pathname)) return;

            event.respondWith(serveGame().catch(error => {
              console.error(error);
              return new Response(
                "<!doctype html><meta charset=utf-8><title>DoLP 載入失敗</title><p>遊戲核心載入失敗，請回到主網址重新整理。</p>",
                { status: 503, headers: { "Content-Type": "text/html; charset=utf-8" } },
              );
            }));
          });
          EOF

          cat > /tmp/dolp-build/launcher.html <<EOF
          <!doctype html>
          <html lang="zh-Hant">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#101014">
            <title>DoLP v0.768 · Aoki+Mysterious · ModLoader</title>
            <style>
              :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}
              body{margin:0;min-height:100svh;display:grid;place-items:center;background:#101014;color:#f2edf7;padding:1.2rem}
              main{width:min(88vw,29rem);text-align:center}.spinner{width:2.7rem;height:2.7rem;margin:0 auto 1.2rem;border:.28rem solid #3a3440;border-top-color:#d49bea;border-radius:50%;animation:spin .85s linear infinite}
              h1{margin:0 0 .55rem;font-size:1.16rem}p{margin:0;color:#bdb4c5;line-height:1.55;font-size:.94rem}.actions{margin-top:1.2rem}[hidden]{display:none!important}
              button{padding:.72rem 1.1rem;border:0;border-radius:.65rem;background:#ba7ad3;color:#120d15;font:inherit;font-weight:700}@keyframes spin{to{transform:rotate(360deg)}}
            </style>
          </head>
          <body>
            <main>
              <div class="spinner" id="spinner"></div>
              <h1 id="status">正在準備 DoLP v0.768…</h1>
              <p id="detail">Aoki+Mysterious · ModLoader · 同站圖片版</p>
              <div class="actions" id="actions" hidden><button id="retry" type="button">重新載入</button></div>
            </main>
            <noscript>此遊戲需要 JavaScript。</noscript>
            <script>
              (() => {
                "use strict";
                const BUILD_ID = "${BUILD_ID}";
                const GAME_PAGE = "game-v0768.html";
                const siteRoot = new URL("./", location.href);
                const targetUrl = new URL(GAME_PAGE, siteRoot);
                targetUrl.searchParams.set("build", BUILD_ID);
                const status = document.getElementById("status");
                const detail = document.getElementById("detail");
                const spinner = document.getElementById("spinner");
                const actions = document.getElementById("actions");
                document.getElementById("retry").addEventListener("click", () => location.reload());
                const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

                function readWorkerBuildId(worker) {
                  return new Promise(resolve => {
                    const channel = new MessageChannel();
                    const timeout = setTimeout(() => resolve(null), 800);
                    channel.port1.onmessage = event => { clearTimeout(timeout); resolve(event.data); };
                    worker.postMessage("getBuildId", [channel.port2]);
                  });
                }

                async function waitForCurrentWorker(registration) {
                  const deadline = Date.now() + 20000;
                  while (Date.now() < deadline) {
                    const candidate = registration.installing || registration.waiting;
                    if (candidate && candidate.state === "installed") candidate.postMessage("skipWaiting");
                    if (registration.active && (await readWorkerBuildId(registration.active)) === BUILD_ID) return;
                    await delay(100);
                  }
                  throw new Error("網站載入器沒有完成更新，請重新整理後再試。");
                }

                async function start() {
                  if (!("serviceWorker" in navigator)) throw new Error("這個瀏覽器不支援遊戲所需的網站載入器。");
                  const workerUrl = new URL("sw.js", siteRoot);
                  workerUrl.searchParams.set("build", BUILD_ID);
                  const registration = await navigator.serviceWorker.register(workerUrl, {
                    scope: siteRoot.pathname,
                    updateViaCache: "none",
                  });
                  await registration.update().catch(() => undefined);
                  await waitForCurrentWorker(registration);

                  const onTarget = location.pathname.endsWith("/" + GAME_PAGE);
                  if (!onTarget) {
                    status.textContent = "載入器已就緒，正在進入遊戲…";
                    location.replace(targetUrl.href);
                    return;
                  }

                  const attemptKey = "dolp-mys-sw-boot-" + BUILD_ID;
                  const attempts = Number(sessionStorage.getItem(attemptKey) || "0") + 1;
                  sessionStorage.setItem(attemptKey, String(attempts));
                  if (attempts > 3) throw new Error("遊戲核心沒有被 Service Worker 正確接管，請回到主網址再試一次。");
                  location.replace(targetUrl.href);
                }

                start().catch(error => {
                  console.error(error);
                  spinner.hidden = true;
                  status.textContent = "遊戲沒有成功載入";
                  detail.textContent = error instanceof Error ? error.message : String(error);
                  actions.hidden = false;
                });
              })();
            </script>
          </body>
          </html>
          EOF

          cp /tmp/dolp-build/launcher.html /tmp/dolp-site/index.html
          cp /tmp/dolp-build/launcher.html /tmp/dolp-site/game-v0768.html
          touch /tmp/dolp-site/.nojekyll

          cat > /tmp/dolp-site/build-info.json <<EOF
          {"core":"0.5.11.9 DoLP v0.768","artPack":"aokiutage_mys","build":"${BUILD_ID}","sourceSha256":"ebda02401b169579b30bfd3796e685e60bee23d46ee06f61548c5e7f0f2108ef","compressedBytes":${COMPRESSED},"uncompressedBytes":${UNCOMPRESSED},"imageMode":"same-origin-static","imageCount":${IMAGE_COUNT},"imageBytes":${IMAGE_BYTES}}
          EOF

          echo "BUILD_ID=$BUILD_ID"
          echo "IMAGE_COUNT=$IMAGE_COUNT"
          echo "IMAGE_BYTES=$IMAGE_BYTES"

      - name: Publish generated site to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan gh-pages-build
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/dolp-site/. .
          git add -A
          git commit -m "Deploy DoLP v0.768 Aoki+Mysterious static-image site"
          git push --force origin HEAD:gh-pages
