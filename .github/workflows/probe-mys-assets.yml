name: Probe Aoki Mysterious asset map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mys-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect screenshot image mappings and CDN headers
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://dolp.dolmods.net/aokimyst/'
          curl -fL --max-time 120 -A 'Mozilla/5.0' "${ROOT}img.json" -o img.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('img.json').read_text('utf-8'))
          keys=[
            'misc/sky/stars/star-2.png',
            'misc/sky/stars/star-3.png',
            'misc/sky/stars/star-4.png',
            'misc/locations/banner/ice.png',
            'misc/locations/banner/water.png',
            'misc/locations/banner/reflective.png',
            'misc/locations/banner/snow.png',
            'ui/card-logo.png',
          ]
          print('mapping_count=',len(d))
          for k in keys:
              print(f'{k} => {d.get(k)}')
          Path('selected.txt').write_text('\n'.join(f'{k}\t{d.get(k) or ""}' for k in keys),'utf-8')
          PY

          echo '--- CDN headers/tests ---'
          while IFS=$'\t' read -r key mapped; do
            echo "=== $key ==="
            if [ -z "$mapped" ]; then
              echo "MISSING_IN_MAP"
              continue
            fi
            url="https://img.dolmods.net/${mapped}"
            echo "$url"
            curl -L -sS --max-time 30 -D - -o /dev/null "$url" | grep -iE '^(HTTP/|content-type:|content-length:|access-control-allow-origin:|cross-origin-resource-policy:|cache-control:|location:)' || true
          done < selected.txt
