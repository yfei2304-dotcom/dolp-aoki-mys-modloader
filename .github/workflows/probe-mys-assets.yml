name: Probe Aoki Mysterious asset map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mys-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect MYS img.json and CDN mappings
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://dolp.dolmods.net/aokimyst/'
          curl -fL --max-time 120 -A 'Mozilla/5.0' "${ROOT}img.json" -o img.json
          echo "img_json_bytes=$(wc -c < img.json)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('img.json').read_text('utf-8'))
          print('mapping_count=',len(d))
          keys=['ui/card-logo.png','ui/refresh.png','ui/reload.png','body/base-classic.png','body/base-head.png','body/mannequin/base-body.png']
          for k in keys:
              print(f'{k} => {d.get(k)}')
          print('first_10=')
          for i,(k,v) in enumerate(d.items()):
              if i>=10: break
              print(k,'=>',v)
          Path('selected.txt').write_text('\n'.join(f'{k}\t{d.get(k) or ""}' for k in keys),'utf-8')
          PY
          echo '--- CDN tests ---'
          while IFS=$'\t' read -r key mapped; do
            [ -n "$mapped" ] || continue
            url="https://img.dolmods.net/${mapped}"
            echo "=== $key -> $url ==="
            curl -L -sS --max-time 30 -o /dev/null -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download} FINAL=%{url_effective}\n' "$url" || true
          done < selected.txt
