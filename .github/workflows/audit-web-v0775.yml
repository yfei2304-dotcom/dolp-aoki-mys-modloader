name: Audit live DoLP v0.775 runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-web-v0775.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          for p in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$p" ]; then echo "path=$p" >> "$GITHUB_OUTPUT"; "$p" --version; exit 0; fi
          done
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/dolp775-audit
          cd /tmp/dolp775-audit
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.59.1
          npx playwright install --with-deps webkit

      - name: Audit public v0.775 site
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dolp775-audit
          cat > audit.js <<'JS'
          const { chromium, webkit } = require('playwright');

          (async () => {
            const root='https://yfei2304-dotcom.github.io/dolp-aoki-mys-modloader/v0775/';
            const info=await (await fetch(root+'build-info.json?audit='+Date.now(),{cache:'no-store'})).json();
            console.log('LIVE_BUILD_INFO='+JSON.stringify(info));
            if(info.core!=='0.5.12.8 DoLP v0.775') throw new Error('Wrong live core');
            if(info.officialImageFiles < 30000) throw new Error('Unexpected live image count');

            async function runBrowser(label, browserType, launchOptions={}){
              const browser=await browserType.launch(launchOptions);
              const context=await browser.newContext({serviceWorkers:'allow'});
              const page=await context.newPage();
              const badResponses=[],failedRequests=[],pageErrors=[],consoleErrors=[];
              page.on('response',r=>{if(r.status()>=400) badResponses.push({status:r.status(),url:r.url(),type:r.request().resourceType()});});
              page.on('requestfailed',r=>failedRequests.push({url:r.url(),type:r.resourceType(),error:r.failure()?.errorText||null}));
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text());});

              await page.goto(root+'?audit='+label+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForURL(u=>u.pathname.endsWith('/v0775/game-v0775.html'),{timeout:120000});
              await page.waitForFunction(() =>
                Array.isArray(window.modDataValueZipList) &&
                window.modDataValueZipList.length===23 &&
                typeof window.modSC2DataManager!=='undefined' &&
                typeof window.modUtils!=='undefined',
                null,{timeout:120000}
              );
              await page.waitForTimeout(10000);

              const state=await page.evaluate(async()=>{
                const reg=await navigator.serviceWorker?.getRegistration();
                const imgs=[...document.images].map(i=>({src:i.currentSrc||i.src,complete:i.complete,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight}));
                return {
                  href:location.href,title:document.title,
                  controlled:!!navigator.serviceWorker?.controller,
                  controllerScript:navigator.serviceWorker?.controller?.scriptURL||null,
                  modZipCount:Array.isArray(window.modDataValueZipList)?window.modDataValueZipList.length:null,
                  hasModManager:typeof window.modSC2DataManager!=='undefined',
                  hasModUtils:typeof window.modUtils!=='undefined',
                  imageElements:imgs.length,
                  brokenImages:imgs.filter(i=>i.complete&&i.naturalWidth===0),
                  bodyTextSample:(document.body?.innerText||'').slice(0,400)
                };
              });

              const allowedConsole=consoleErrors.filter(x=>x.includes('window.initI10n is not a function'));
              const unexpectedConsole=consoleErrors.filter(x=>!x.includes('window.initI10n is not a function'));
              console.log(label+'_STATE='+JSON.stringify(state));
              console.log(label+'_BAD_RESPONSES='+JSON.stringify(badResponses));
              console.log(label+'_FAILED_REQUESTS='+JSON.stringify(failedRequests));
              console.log(label+'_PAGE_ERRORS='+JSON.stringify(pageErrors));
              console.log(label+'_CONSOLE_ERRORS='+JSON.stringify(consoleErrors));

              if(!state.controlled) throw new Error(label+': Service Worker did not control page');
              if(!state.controllerScript?.includes('/v0775/sw.js?build=v0775')) throw new Error(label+': unexpected SW controller');
              if(state.modZipCount!==23||!state.hasModManager||!state.hasModUtils) throw new Error(label+': ModLoader runtime incomplete');
              if(state.brokenImages.length) throw new Error(label+': broken DOM images '+JSON.stringify(state.brokenImages));
              if(failedRequests.length) throw new Error(label+': failed requests '+JSON.stringify(failedRequests));
              if(pageErrors.length) throw new Error(label+': page errors '+JSON.stringify(pageErrors));
              if(unexpectedConsole.length) throw new Error(label+': unexpected console errors '+JSON.stringify(unexpectedConsole));
              await browser.close();
            }

            await runBrowser('chromium',chromium,{headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
            await runBrowser('webkit',webkit,{});
            console.log('LIVE_WEB_V0775_CHROMIUM_WEBKIT=PASS');
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
          node audit.js
