name: Probe compile DoLP tags

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-compile-dolp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tag: [v0.768, v0.772]
    steps:
      - name: Download and compile upstream tag
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ matrix.tag }}'
          API='https://gitgud.io/api/v4/projects/Frostberg%2Fdegrees-of-lewdity-plus'
          ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$TAG")
          curl -fL --retry 2 --max-time 180 -A 'Mozilla/5.0'             "$API/repository/archive.tar.gz?sha=$ENC" -o src.tar.gz
          mkdir src
          tar -xzf src.tar.gz -C src --strip-components=1
          cd src
          chmod +x compile.sh devTools/tweego/tweego_linux64 || true
          FORCE_VERSION="$TAG" ./compile.sh
          OUT=$(find . -maxdepth 2 -type f -name 'Degrees of Lewdity*.html' ! -type l | head -n1)
          test -n "$OUT"
          cp "$OUT" "../pure-${TAG}.html"
          echo "tag=$TAG"
          echo "bytes=$(wc -c < "../pure-${TAG}.html")"
          sha256sum "../pure-${TAG}.html"
          grep -aoE '0\.5\.[0-9.]+ DoLP v0\.[0-9]+' "../pure-${TAG}.html" | head || true

      - name: Upload pure compiled HTML
        uses: actions/upload-artifact@v4
        with:
          name: pure-${{ matrix.tag }}
          path: pure-${{ matrix.tag }}.html
          compression-level: 9
          retention-days: 1
