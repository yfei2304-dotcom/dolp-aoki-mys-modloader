name: Reconstruct exact user v0.772 ModLoader HTML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-reconstruct-exact772.yml'

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official v0.772 Aoki MYS base
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 300 -A 'Mozilla/5.0 (GitHub Actions)'             'https://dolp.download/DoLP_aoki_utage_mys/v0.772/DoLP_aoki_utage_mys_v0.772.zip'             -o official.zip
          mkdir official
          unzip -q official.zip -d official
          BASE=$(find official -type f -name 'Degrees of Lewdity*.html' | head -n1)
          test -n "$BASE"
          cp "$BASE" official-base.html
          echo "official_base_bytes=$(wc -c < official-base.html)"
          sha256sum official-base.html

      - name: Reproduce ModLoader sc2PatchTool with pinned Cheerio
        shell: bash
        run: |
          set -euo pipefail
          mkdir patcher && cd patcher
          npm init -y >/dev/null 2>&1
          npm install --silent cheerio@1.0.0-rc.12
          cat > patch.js <<'JS'
          const fs = require('fs');
          const cheerio = require('cheerio');
          const htmlF = fs.readFileSync('../official-base.html','utf8');
          const ht = cheerio.load(htmlF);
          const sC2Script = ht('script#script-sugarcube[type="text/javascript"]');
          if (sC2Script.length !== 1) throw new Error('SugarCube script count=' + sC2Script.length);
          let sc2JsText = sC2Script.text();
          const starHeadOld = 'window.SugarCube={},jQuery((()=>{';
          const startHeadNew = 'window.SugarCube={},window.mainStart=((()=>{';
          const startTailOld = '}))})(window,window.document,jQuery);';
          const startTailNew = `}))
          // inject ModLoader on there
          if (typeof window.modSC2DataManager !== 'undefined') {
          window.modSC2DataManager.startInit().then(() => window.jsPreloader.startLoad()).then(() => {window.mainStart();window.initI10n(l10nStrings);}).catch(err => {console.error(err);});}else {window.mainStart();window.initI10n(l10nStrings);
          }
              })(window,window.document,jQuery);`;
          if (!sc2JsText.includes(starHeadOld)) throw new Error('start head not found');
          if (!sc2JsText.includes(startTailOld)) throw new Error('start tail not found');
          sc2JsText = sc2JsText.split(starHeadOld).join(startHeadNew).split(startTailOld).join(startTailNew);
          sC2Script.text(sc2JsText);
          const out = ht.root().html();
          if (!out) throw new Error('empty cheerio output');
          fs.writeFileSync('../official-base.sc2patch.html', out, 'utf8');
          JS
          node patch.js
          cd ..
          echo "patched_bytes=$(wc -c < official-base.sc2patch.html)"
          echo "patched_sha256=$(sha256sum official-base.sc2patch.html | awk '{print $1}')"
          echo "expected_bytes=54057021"
          echo "expected_sha256=db22e9d374172de76a8788c3e338349326cfdfb9e46792bf6820155496c7a7be"

      - name: Upload patched base for byte diff
        uses: actions/upload-artifact@v4
        with:
          name: cheerio-patched-v0772
          path: official-base.sc2patch.html
          compression-level: 9
          retention-days: 1

      - name: Extract exact Loader blocks from known-good v0.768
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 180 -A 'Mozilla/5.0 (GitHub Actions)'             'https://dolp-aoki-modloader.yfei2304.chatgpt.site/payload/game-v0768.bundle'             -o exact768.gz
          gzip -dc exact768.gz > exact768.html
          test "$(wc -c < exact768.html)" = "67147773"
          test "$(sha256sum exact768.html | awk '{print $1}')" = "ebda02401b169579b30bfd3796e685e60bee23d46ee06f61548c5e7f0f2108ef"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          s=Path('exact768.html').read_text('utf-8')
          first=s.find('<script')
          end1=s.find('</script>', first)+len('</script>')
          second=s.find('<script', end1)
          end2=s.find('</script>', second)+len('</script>')
          if min(first,end1,second,end2) < 0: raise SystemExit('loader script boundary not found')
          script1=s[first:end1]
          script2=s[second:end2]
          if 'window.modDataValueZipList' not in script1: raise SystemExit('script1 wrong')
          if 'modSC2DataManager' not in script2: raise SystemExit('script2 wrong')
          Path('loader1.txt').write_text(script1,'utf-8')
          Path('loader2.txt').write_text(script2,'utf-8')
          for n,x in [('loader1',script1),('loader2',script2)]:
              print(n,'bytes=',len(x.encode()),'sha256=',hashlib.sha256(x.encode()).hexdigest())
          PY

      - name: Inject exact Loader blocks into patched official v0.772
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          base=Path('official-base.sc2patch.html').read_text('utf-8')
          one=Path('loader1.txt').read_text('utf-8')
          two=Path('loader2.txt').read_text('utf-8')
          idx=base.find('<script')
          if idx < 0: raise SystemExit('base first script not found')
          csp_find = "content=\"default-src 'self' 'unsafe-eval' 'unsafe-inline'"
          csp_replace = "content=\"default-src 'self' 'unsafe-eval' 'unsafe-inline' *"
          if csp_find not in base: raise SystemExit('CSP marker not found')
          base2 = base.replace(csp_find, csp_replace, 1)
          final=base2[:idx] + '\n' + one + '\n' + two + '\n' + base2[idx:]
          Path('candidate-v0772-reconstructed.html').write_text(final,'utf-8')
          b=final.encode()
          print('candidate_bytes=',len(b))
          print('candidate_sha256=',hashlib.sha256(b).hexdigest())
          expected_size=68512914
          expected_sha='6e792d8fd8992e74df8906b091495abc61582602e8d88eb6b32680e94635ef8d'
          if len(b) != expected_size: raise SystemExit(f'size mismatch: {len(b)} != {expected_size}')
          if hashlib.sha256(b).hexdigest() != expected_sha: raise SystemExit('SHA256 mismatch')
          print('EXACT_USER_V0772_MATCH=YES')
          PY

      - name: Upload candidate core
        uses: actions/upload-artifact@v4
        with:
          name: exact-v0772-reconstructed
          path: candidate-v0772-reconstructed.html
          compression-level: 9
          retention-days: 1
